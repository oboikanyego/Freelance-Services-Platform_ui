<article class="service-card">
  <div class="media">
    <img *ngIf="service.imageUrl && !imageFailed; else placeholder" [src]="service.imageUrl"
      [alt]="service.title" loading="lazy" (error)="imageFailed = true" />
    <ng-template #placeholder>
      <div class="placeholder"><span class="material-icons-round">image</span></div>
    </ng-template>
    <span class="category" *ngIf="service.category">{{ service.category }}</span>
  </div>

  <div class="body">
    <h3 class="title">{{ service.title }}</h3>
    <p class="description">{{ service.description }}</p>

    <div class="seller">
      <span class="avatar">{{ (service.userId.name || '?').charAt(0) }}</span>
      <span>{{ service.userId.name }}</span>
    </div>
  </div>

  <footer class="footer">
    <div class="price">
      <small>Starting at</small>
      <strong>R {{ service.price | number }}</strong>
    </div>
    <button mat-flat-button (click)="orderNow()" [disabled]="isLoading"
      *ngIf="authService.isLoggedIn() && service.userId._id !== authService.getUser()?.userId">
      {{ isLoading ? 'Ordering…' : 'Order now' }}
    </button>
  </footer>
</article>
